[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hssnb"
version = "0.2.0"
description = "PyTorch implementation of the Hybrid CNN Bi-LSTM network for hyperspectral image classification"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.2",
    "matplotlib>=3.7",
    "seaborn>=0.12",
]

[project.optional-dependencies]
notebooks = ["jupyter>=1.0", "ipykernel>=6.0", "rasterio>=1.3"]
dev = ["pytest>=8", "hypothesis>=6", "ruff>=0.6"]

[tool.setuptools]
packages = ["hssnb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
